
name: Build Kinox APK

on:
  push:
    branches:
      - main
      - master

  pull_request:

  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    name: Generate Android APK
    runs-on: ubuntu-24.04
    timeout-minutes: 40

    steps:
      # 1. Descargar repositorio
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Configurar Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # 3. Configurar Java
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 4. Configurar Android SDK
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # 5. Aceptar licencias
      - name: Accept Android licenses
        run: |
          yes | sdkmanager --licenses || true

      # 6. Instalar dependencias
      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci --no-audit --no-fund
          else
            npm install --no-audit --no-fund
          fi

      # 7. Comprobar configuración
      - name: Verify Capacitor configuration
        run: |
          if [ ! -f capacitor.config.json ] &&
             [ ! -f capacitor.config.ts ] &&
             [ ! -f capacitor.config.js ]; then
            echo "ERROR: Falta la configuración de Capacitor"
            exit 1
          fi

          if [ ! -d www ]; then
            mkdir -p www
          fi

          if [ ! -f www/index.html ]; then
            echo '<!DOCTYPE html><html><head><meta charset="UTF-8"></head><body></body></html>' > www/index.html
          fi

          echo "Configuración encontrada"

      # 8. Agregar Android si todavía no existe
      - name: Add Android platform
        run: |
          if [ ! -f android/app/build.gradle ] &&
             [ ! -f android/app/build.gradle.kts ]; then
            echo "Generando proyecto Android..."
            rm -rf android
            npx cap add android
          else
            echo "Proyecto Android encontrado"
          fi

      # 9. Sincronizar Capacitor
      - name: Sync Android
        run: |
          npx cap sync android

      # 10. Compilar APK
      - name: Build Debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      # 11. Verificar APK
      - name: Verify APK
        run: |
          APK="android/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: No se generó el APK"
            exit 1
          fi

          ls -lh "$APK"

      # 12. Publicar APK
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Kinox-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
