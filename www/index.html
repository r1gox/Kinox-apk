
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0a0611">
  <title>Kinox</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #0a0611;
      color: white;
      font-family: Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
    }

    .container {
      padding: 30px;
      max-width: 400px;
    }

    h1 {
      font-size: 36px;
      margin-bottom: 12px;
    }

    p {
      color: #aaa;
      line-height: 1.6;
    }

    button {
      background: #8b35ff;
      color: white;
      border: 0;
      border-radius: 8px;
      padding: 13px 25px;
      margin-top: 15px;
      font-size: 15px;
      cursor: pointer;
    }
  </style>
</head>

<body>
  <div class="container">
    <h1>KINOX</h1>
    <p>No se pudo conectar con Kinox.</p>
    <p>Comprueba tu conexión a internet e inténtalo nuevamente.</p>
    <button onclick="location.reload()">Reintentar</button>
  </div>
</body>
</html>
